
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>YouTube Player</h1>

    <div class="main-container">

        <!-- Left: Player -->
        <main class="player-section">

            <div class="input-area">
                <input
                    id="url"
                    type="text"
                    placeholder="YouTube URLまたは動画IDを入力"
                >
                <button onclick="loadVideo()">再生</button>
            </div>

            <div id="player"></div>

        </main>

        <!-- Right: History -->
        <aside class="history-section">

            <div class="history-header">
                <h2>再生履歴</h2>

                <button onclick="clearHistory()" class="delete-all">
                    すべて削除
                </button>
            </div>

            <div id="history">
                <p>履歴はありません。</p>
            </div>

        </aside>

    </div>

    <script src="script.js" defer></script>

</body>
</html>
