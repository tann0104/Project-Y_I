
<div class="main-container">

    <!-- Player -->
    <main class="player-section">

        <div class="input-area">
            <input
                id="url"
                type="text"
                placeholder="YouTube URLまたは動画IDを入力"
            >
            <button onclick="loadVideo()">再生</button>
        </div>

        <div id="player"></div>

        <!-- History: Below Player -->
        <aside class="history-section">

            <div class="history-header">
                <h2>再生履歴</h2>

                <button onclick="clearHistory()" class="delete-all">
                    すべて削除
                </button>
            </div>

            <div id="history">
                <p>履歴はありません。</p>
            </div>

        </aside>

    </main>

</div>
